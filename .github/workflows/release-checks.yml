# Release checks: stop a broken build before it reaches the App Store or Google Play.
#
# iOS 1.6.1 built, archived and uploaded without GoogleService-Info.plist and crashed at launch for
# every user. Each job below would have stopped one part of that chain. See docs/release-checklist.md
# for the secrets these jobs need.

name: Release checks

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: testDebugUnitTest
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/
          retention-days: 7

  android-release-build:
    name: Android release build (signed, with Firebase config)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check the release bundle
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/ci/android-release-check.sh
      # The signed bundle is NOT uploaded as an artifact on purpose: store uploads stay manual.

  ios-unit-tests:
    name: iOS unit tests
    runs-on: macos-26
    timeout-minutes: 75
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Restore GoogleService-Info.plist
        # Debug tolerates a missing plist, but every database-backed test then crashes in Auth.auth().
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: scripts/ci/ios-restore-config.sh
      - uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
      - name: pod install
        run: pod install
      - name: Run FinovaTests
        # Serial on purpose: in parallel runs the suites pollute each other and a different set
        # fails every time. Serial runs give a stable list (ci/known-ios-test-failures.txt).
        run: |
          UDID=$(scripts/ci/pick-simulator.sh)
          xcodebuild test \
            -workspace Finova.xcworkspace \
            -scheme FinovaTests \
            -destination "id=$UDID" \
            -derivedDataPath build/test-derived-data \
            -resultBundlePath build/FinovaTests.xcresult \
            -parallel-testing-enabled NO \
            -quiet || echo "xcodebuild exited non-zero; the next step decides whether the failures are new."
      - name: Compare failures with the known list
        # Fails on any failure that is not in ci/known-ios-test-failures.txt, or when no tests ran.
        run: python3 scripts/ci/check-ios-test-results.py build/FinovaTests.xcresult
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FinovaTests-xcresult
          path: build/FinovaTests.xcresult
          retention-days: 7

  ios-launch-smoke-test:
    name: iOS launch smoke test (Release)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: scripts/ci/ios-restore-config.sh
      - uses: actions/cache@v4
        with:
          path: Pods
          key: pods-${{ runner.os }}-${{ hashFiles('Podfile.lock') }}
      - name: pod install
        run: pod install
      - name: Build Release, launch, and stay alive for 12 s
        run: scripts/ci/ios-launch-smoke-test.sh
      - name: Upload smoke test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-logs
          path: build/smoke-logs/
          retention-days: 7

  release-branch-audit:
    name: Release branch audit (fixes left behind)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every branch and its full history
      - name: List fix commits missing from the newest release branch
        run: scripts/release-branch-audit.sh
